aid: freed-ai
name: Freed
description: >-
  Freed is a San Francisco-based AI medical scribe and clinician assistant
  designed to reduce the documentation burden on healthcare providers. The
  product listens to patient visits and generates SOAP-style clinical notes,
  visit summaries, patient instructions, referral letters, and ICD-10 / CPT
  coding suggestions, then transfers the finalized note into the clinician's
  EHR via a browser-resident agent. Freed was founded in 2023 by former
  Facebook engineers Erez Druk (CEO) and Andrey Bannikov (CTO) after Druk's
  wife, a practicing family physician, experienced the daily toll of manual
  charting. The company is consumer self-serve: clinicians sign up for a 7-day
  free trial and then a monthly Starter, Core, Premier, or custom Groups plan
  with no enterprise sales required. As of 2025 Freed reported more than
  20,000 paying clinician users and raised a $30M Series A led by Sequoia
  Capital, bringing total funding to $34M. The platform is HIPAA-compliant,
  SOC 2 Type II certified, and HITECH-ready; patient recordings are not
  stored. Rather than ship a traditional public REST API, Freed pursues an
  "anti-integration" model in which a Chrome-extension AI agent navigates any
  web-based EHR (Athena, Tebra, PracticeFusion, TherapyNotes, SimplePractice,
  Elation, AdvancedMD, Cerbo, and others) to place the finished note in the
  correct fields. There is no public developer API, SDK, or open-source
  release.
